  <link rel="manifest" href="manifest.json">

  <script src="js/vendor/tailwind.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'Prompt', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            mono: ['JetBrains Mono', 'Fira Code', 'SFMono-Regular', 'Consolas', 'monospace']

          colors: {
            kube: {
              50: '#eff6ff',
              100: '#dbeafe',
              400: '#60a5fa',
              500: '#326ce5',
              600: '#2563eb',
              700: '#1d4ed8',
              900: '#1e3a8a',

          animation: {
            fadeIn: 'fadeIn 0.25s ease-out',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0', transform: 'translateY(6px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            }
          }
        }
      }
    }
  </script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/styles.css">
</head>

            <!-- Injected by renderSidebarDropdowns -->

        <button data-nav-target="profile" class="w-full flex items-center justify-center lg:justify-start gap-3 px-3 lg:px-4 py-3 rounded-2xl text-xs font-bold text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all text-left group" title="Profile">

      <span class="text-base leading-none">☸️</span>

    <button data-bottom-nav="concepts" onclick="window.app.navigateTo('concepts')" class="flex-1 min-w-0 flex flex-col items-center justify-center py-1 rounded-xl transition-all text-slate-500 dark:text-slate-400 font-medium active:scale-95">
