<svg viewBox="0 0 800 380" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
      
  <style>
    .bg { fill: #0f172a; rx: 16; }
    .card { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 12; }
    .card-hl { fill: #1e3a8a; stroke: #3b82f6; stroke-width: 2; rx: 12; }
    .card-cp { fill: #312e81; stroke: #6366f1; stroke-width: 2; rx: 12; }
    .card-worker { fill: #064e3b; stroke: #10b981; stroke-width: 2; rx: 12; }
    .text-title { fill: #f8fafc; font-family: system-ui, sans-serif; font-size: 18px; font-weight: bold; }
    .text-sub { fill: #94a3b8; font-family: system-ui, sans-serif; font-size: 13px; }
    .text-body { fill: #e2e8f0; font-family: system-ui, sans-serif; font-size: 14px; font-weight: 600; }
    .text-code { fill: #38bdf8; font-family: monospace; font-size: 13px; }
    .text-badge { fill: #38bdf8; font-family: system-ui, sans-serif; font-size: 11px; font-weight: bold; }
    .arrow { stroke: #64748b; stroke-width: 2; marker-end: url(#arrowhead); fill: none; }
    .arrow-hl { stroke: #38bdf8; stroke-width: 2.5; marker-end: url(#arrowhead-hl); fill: none; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#64748b"/>
    </marker>
    <marker id="arrowhead-hl" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#38bdf8"/>
    </marker>
  </defs>

      <rect width="800" height="380" class="bg"/>
      <text x="400" y="40" text-anchor="middle" class="text-title">Multi-Container Pod Patterns &amp; Shared Resources</text>
      <text x="400" y="65" text-anchor="middle" class="text-sub">Sidecar, Shared localhost, and emptyDir Volumes</text>

      <!-- Pod Boundary -->
      <rect x="80" y="90" width="640" height="250" class="card" stroke="#3b82f6" stroke-width="2" rx="16"/>
      <text x="110" y="125" class="text-body" fill="#60a5fa">Pod Namespace (Shared localhost &amp; Network)</text>

      <!-- Main Container -->
      <rect x="110" y="145" width="260" height="110" class="card-hl"/>
      <text x="240" y="180" text-anchor="middle" class="text-body">App Container</text>
      <text x="240" y="205" text-anchor="middle" class="text-sub">Writes logs / API business logic</text>
      <text x="240" y="230" text-anchor="middle" class="text-code">Port 8080</text>

      <!-- Sidecar Container -->
      <rect x="430" y="145" width="260" height="110" class="card" stroke="#10b981" fill="#064e3b"/>
      <text x="560" y="180" text-anchor="middle" class="text-body" fill="#6ee7b7">Sidecar Container</text>
      <text x="560" y="205" text-anchor="middle" class="text-sub">Log shipping / Envoy proxy / Vault</text>
      <text x="560" y="230" text-anchor="middle" class="text-code">Native: restartPolicy: Always</text>

      <!-- Shared Volume -->
      <rect x="230" y="270" width="340" height="50" class="card" fill="#334155" stroke="#94a3b8"/>
      <text x="400" y="300" text-anchor="middle" class="text-body" fill="#f1f5f9">📁 Shared emptyDir Volume (/var/log)</text>

      <!-- Arrows to volume -->
      <path d="M 240 255 L 270 270" class="arrow"/>
      <path d="M 560 255 L 530 270" class="arrow"/>
    </svg>