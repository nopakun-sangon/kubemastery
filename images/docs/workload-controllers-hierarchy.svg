<svg viewBox="0 0 840 400" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
      
  <style>
    .bg { fill: #0f172a; rx: 16; }
    .card { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 12; }
    .card-hl { fill: #1e3a8a; stroke: #3b82f6; stroke-width: 2; rx: 12; }
    .card-cp { fill: #312e81; stroke: #6366f1; stroke-width: 2; rx: 12; }
    .card-worker { fill: #064e3b; stroke: #10b981; stroke-width: 2; rx: 12; }
    .text-title { fill: #f8fafc; font-family: system-ui, sans-serif; font-size: 18px; font-weight: bold; }
    .text-sub { fill: #94a3b8; font-family: system-ui, sans-serif; font-size: 13px; }
    .text-body { fill: #e2e8f0; font-family: system-ui, sans-serif; font-size: 14px; font-weight: 600; }
    .text-code { fill: #38bdf8; font-family: monospace; font-size: 13px; }
    .text-badge { fill: #38bdf8; font-family: system-ui, sans-serif; font-size: 11px; font-weight: bold; }
    .arrow { stroke: #64748b; stroke-width: 2; marker-end: url(#arrowhead); fill: none; }
    .arrow-hl { stroke: #38bdf8; stroke-width: 2.5; marker-end: url(#arrowhead-hl); fill: none; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#64748b"/>
    </marker>
    <marker id="arrowhead-hl" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#38bdf8"/>
    </marker>
  </defs>

      <rect width="840" height="400" class="bg"/>
      <text x="420" y="40" text-anchor="middle" class="text-title">Workload Controllers Hierarchy &amp; Management</text>
      <text x="420" y="65" text-anchor="middle" class="text-sub">Deployments, ReplicaSets, StatefulSets, DaemonSets, and Jobs</text>

      <!-- Deployment Level -->
      <rect x="80" y="100" width="220" height="80" class="card-hl"/>
      <text x="190" y="135" text-anchor="middle" class="text-body">Deployment</text>
      <text x="190" y="160" text-anchor="middle" class="text-sub">RollingUpdate &amp; History</text>

      <!-- ReplicaSet Level -->
      <rect x="80" y="220" width="220" height="70" class="card"/>
      <text x="190" y="250" text-anchor="middle" class="text-body">ReplicaSet</text>
      <text x="190" y="270" text-anchor="middle" class="text-sub">Maintains pod count</text>

      <!-- Pods -->
      <rect x="60" y="325" width="80" height="45" class="card" fill="#065f46"/>
      <text x="100" y="352" text-anchor="middle" class="text-sub">Pod 1</text>
      <rect x="150" y="325" width="80" height="45" class="card" fill="#065f46"/>
      <text x="190" y="352" text-anchor="middle" class="text-sub">Pod 2</text>
      <rect x="240" y="325" width="80" height="45" class="card" fill="#065f46"/>
      <text x="280" y="352" text-anchor="middle" class="text-sub">Pod 3</text>

      <path d="M 190 180 L 190 220" class="arrow-hl"/>
      <path d="M 190 290 L 190 320" class="arrow-hl"/>

      <!-- StatefulSet Column -->
      <rect x="360" y="100" width="200" height="190" class="card" stroke="#818cf8"/>
      <text x="460" y="135" text-anchor="middle" class="text-body" fill="#a5b4fc">StatefulSet</text>
      <text x="460" y="165" text-anchor="middle" class="text-sub">Stable network ID</text>
      <text x="460" y="185" text-anchor="middle" class="text-code">web-0, web-1, web-2</text>
      <text x="460" y="215" text-anchor="middle" class="text-sub">Ordered Scaling</text>
      <text x="460" y="240" text-anchor="middle" class="text-sub">Persistent storage per pod</text>

      <!-- DaemonSet Column -->
      <rect x="590" y="100" width="200" height="90" class="card" stroke="#10b981"/>
      <text x="690" y="135" text-anchor="middle" class="text-body" fill="#34d399">DaemonSet</text>
      <text x="690" y="165" text-anchor="middle" class="text-sub">One pod per node (Agents)</text>

      <!-- Jobs & CronJobs -->
      <rect x="590" y="210" width="200" height="90" class="card" stroke="#f59e0b"/>
      <text x="690" y="245" text-anchor="middle" class="text-body" fill="#fbbf24">CronJob / Job</text>
      <text x="690" y="270" text-anchor="middle" class="text-sub">Batch runs to completion</text>
    </svg>