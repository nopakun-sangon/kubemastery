<svg viewBox="0 0 860 360" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
      
  <style>
    .bg { fill: #0f172a; rx: 16; }
    .card { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 12; }
    .card-hl { fill: #1e3a8a; stroke: #3b82f6; stroke-width: 2; rx: 12; }
    .card-cp { fill: #312e81; stroke: #6366f1; stroke-width: 2; rx: 12; }
    .card-worker { fill: #064e3b; stroke: #10b981; stroke-width: 2; rx: 12; }
    .text-title { fill: #f8fafc; font-family: system-ui, sans-serif; font-size: 18px; font-weight: bold; }
    .text-sub { fill: #94a3b8; font-family: system-ui, sans-serif; font-size: 13px; }
    .text-body { fill: #e2e8f0; font-family: system-ui, sans-serif; font-size: 14px; font-weight: 600; }
    .text-code { fill: #38bdf8; font-family: monospace; font-size: 13px; }
    .text-badge { fill: #38bdf8; font-family: system-ui, sans-serif; font-size: 11px; font-weight: bold; }
    .arrow { stroke: #64748b; stroke-width: 2; marker-end: url(#arrowhead); fill: none; }
    .arrow-hl { stroke: #38bdf8; stroke-width: 2.5; marker-end: url(#arrowhead-hl); fill: none; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#64748b"/>
    </marker>
    <marker id="arrowhead-hl" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#38bdf8"/>
    </marker>
  </defs>

      <rect width="860" height="360" class="bg"/>
      <text x="430" y="40" text-anchor="middle" class="text-title">Pod Lifecycle, Phases &amp; Probe Checkpoints</text>
      <text x="430" y="65" text-anchor="middle" class="text-sub">From Scheduled through Container Readiness to Completion or Termination</text>

      <!-- Phase 1: Pending -->
      <rect x="40" y="110" width="140" height="110" class="card" stroke="#f59e0b"/>
      <text x="110" y="145" text-anchor="middle" class="text-body" fill="#fbbf24">Pending</text>
      <text x="110" y="170" text-anchor="middle" class="text-sub">Scheduling &amp;</text>
      <text x="110" y="190" text-anchor="middle" class="text-sub">Image Pulling</text>

      <!-- Phase 2: Init Containers -->
      <rect x="220" y="110" width="150" height="110" class="card" stroke="#818cf8"/>
      <text x="295" y="145" text-anchor="middle" class="text-body" fill="#a5b4fc">Init Containers</text>
      <text x="295" y="170" text-anchor="middle" class="text-sub">Sequential Run</text>
      <text x="295" y="190" text-anchor="middle" class="text-code">exit 0 required</text>

      <!-- Phase 3: Running -->
      <rect x="410" y="90" width="230" height="160" class="card-worker"/>
      <text x="525" y="125" text-anchor="middle" class="text-body" fill="#34d399">Running</text>
      <rect x="425" y="140" width="200" height="35" class="card" fill="#065f46"/>
      <text x="525" y="162" text-anchor="middle" class="text-sub" fill="#d1fae5">1. Startup Probe</text>
      <rect x="425" y="180" width="200" height="35" class="card" fill="#065f46"/>
      <text x="525" y="202" text-anchor="middle" class="text-sub" fill="#d1fae5">2. Readiness (Traffic In)</text>
      <text x="525" y="235" text-anchor="middle" class="text-code" fill="#6ee7b7">3. Liveness (Restarts)</text>

      <!-- Phase 4: Succeeded / Failed -->
      <rect x="680" y="90" width="140" height="75" class="card" stroke="#10b981"/>
      <text x="750" y="125" text-anchor="middle" class="text-body" fill="#34d399">Succeeded</text>
      <text x="750" y="145" text-anchor="middle" class="text-sub">Jobs exit 0</text>

      <rect x="680" y="180" width="140" height="75" class="card" stroke="#ef4444"/>
      <text x="750" y="215" text-anchor="middle" class="text-body" fill="#f87171">Failed</text>
      <text x="750" y="235" text-anchor="middle" class="text-sub">Crash exit != 0</text>

      <!-- Arrows -->
      <path d="M 180 165 L 220 165" class="arrow-hl"/>
      <path d="M 370 165 L 410 165" class="arrow-hl"/>
      <path d="M 640 135 L 680 135" class="arrow"/>
      <path d="M 640 215 L 680 215" class="arrow"/>
    </svg>