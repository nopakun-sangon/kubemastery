<svg viewBox="0 0 860 400" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
      
  <style>
    .bg { fill: #0f172a; rx: 16; }
    .card { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 12; }
    .card-hl { fill: #1e3a8a; stroke: #3b82f6; stroke-width: 2; rx: 12; }
    .card-cp { fill: #312e81; stroke: #6366f1; stroke-width: 2; rx: 12; }
    .card-worker { fill: #064e3b; stroke: #10b981; stroke-width: 2; rx: 12; }
    .text-title { fill: #f8fafc; font-family: system-ui, sans-serif; font-size: 18px; font-weight: bold; }
    .text-sub { fill: #94a3b8; font-family: system-ui, sans-serif; font-size: 13px; }
    .text-body { fill: #e2e8f0; font-family: system-ui, sans-serif; font-size: 14px; font-weight: 600; }
    .text-code { fill: #38bdf8; font-family: monospace; font-size: 13px; }
    .text-badge { fill: #38bdf8; font-family: system-ui, sans-serif; font-size: 11px; font-weight: bold; }
    .arrow { stroke: #64748b; stroke-width: 2; marker-end: url(#arrowhead); fill: none; }
    .arrow-hl { stroke: #38bdf8; stroke-width: 2.5; marker-end: url(#arrowhead-hl); fill: none; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#64748b"/>
    </marker>
    <marker id="arrowhead-hl" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#38bdf8"/>
    </marker>
  </defs>

      <rect width="860" height="400" class="bg"/>
      <text x="430" y="40" text-anchor="middle" class="text-title">Ingress vs Gateway API Routing Architecture</text>
      <text x="430" y="65" text-anchor="middle" class="text-sub">L7 Routing based on Hostname and URI Path</text>

      <!-- External Client -->
      <rect x="40" y="140" width="160" height="90" class="card-hl"/>
      <text x="120" y="175" text-anchor="middle" class="text-body">Internet Client</text>
      <text x="120" y="200" text-anchor="middle" class="text-code">https://app.k8s.io</text>

      <!-- Ingress / Gateway -->
      <rect x="260" y="110" width="250" height="190" class="card-cp"/>
      <text x="385" y="145" text-anchor="middle" class="text-body" fill="#a5b4fc">Ingress Controller / Gateway</text>
      <text x="385" y="170" text-anchor="middle" class="text-sub">TLS Termination &amp; Routing</text>
      <line x1="280" y1="185" x2="490" y2="185" stroke="#475569"/>
      <text x="385" y="210" text-anchor="middle" class="text-code">/api -> api-svc:8080</text>
      <text x="385" y="240" text-anchor="middle" class="text-code">/web -> web-svc:80</text>

      <!-- Backend Services -->
      <rect x="570" y="110" width="240" height="80" class="card-worker"/>
      <text x="690" y="145" text-anchor="middle" class="text-body" fill="#6ee7b7">api-service (ClusterIP)</text>
      <text x="690" y="170" text-anchor="middle" class="text-sub">Backend API Pods</text>

      <rect x="570" y="220" width="240" height="80" class="card-worker"/>
      <text x="690" y="255" text-anchor="middle" class="text-body" fill="#6ee7b7">web-service (ClusterIP)</text>
      <text x="690" y="280" text-anchor="middle" class="text-sub">Frontend Web Pods</text>

      <path d="M 200 185 L 260 185" class="arrow-hl"/>
      <path d="M 510 150 L 570 150" class="arrow-hl"/>
      <path d="M 510 260 L 570 260" class="arrow-hl"/>
    </svg>