<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
      
  <style>
    .bg { fill: #0f172a; rx: 16; }
    .card { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 12; }
    .card-hl { fill: #1e3a8a; stroke: #3b82f6; stroke-width: 2; rx: 12; }
    .card-cp { fill: #312e81; stroke: #6366f1; stroke-width: 2; rx: 12; }
    .card-worker { fill: #064e3b; stroke: #10b981; stroke-width: 2; rx: 12; }
    .text-title { fill: #f8fafc; font-family: system-ui, sans-serif; font-size: 18px; font-weight: bold; }
    .text-sub { fill: #94a3b8; font-family: system-ui, sans-serif; font-size: 13px; }
    .text-body { fill: #e2e8f0; font-family: system-ui, sans-serif; font-size: 14px; font-weight: 600; }
    .text-code { fill: #38bdf8; font-family: monospace; font-size: 13px; }
    .text-badge { fill: #38bdf8; font-family: system-ui, sans-serif; font-size: 11px; font-weight: bold; }
    .arrow { stroke: #64748b; stroke-width: 2; marker-end: url(#arrowhead); fill: none; }
    .arrow-hl { stroke: #38bdf8; stroke-width: 2.5; marker-end: url(#arrowhead-hl); fill: none; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#64748b"/>
    </marker>
    <marker id="arrowhead-hl" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#38bdf8"/>
    </marker>
  </defs>

      <rect width="800" height="400" class="bg"/>
      <text x="400" y="40" text-anchor="middle" class="text-title">Kubernetes Control Loop: Desired State vs Actual State</text>
      <text x="400" y="65" text-anchor="middle" class="text-sub">Continuous reconciliation cycle driven by Controllers</text>

      <rect x="60" y="110" width="200" height="120" class="card-hl"/>
      <text x="160" y="150" text-anchor="middle" class="text-body">1. Desired State</text>
      <text x="160" y="175" text-anchor="middle" class="text-code">spec: replicas: 3</text>
      <text x="160" y="200" text-anchor="middle" class="text-sub">(Stored in etcd)</text>

      <rect x="300" y="230" width="200" height="120" class="card-cp"/>
      <text x="400" y="270" text-anchor="middle" class="text-body" fill="#c7d2fe">2. Reconcile Loop</text>
      <text x="400" y="295" text-anchor="middle" class="text-sub">Observe -> Analyze</text>
      <text x="400" y="320" text-anchor="middle" class="text-code">Act to match spec</text>

      <rect x="540" y="110" width="200" height="120" class="card-worker"/>
      <text x="640" y="150" text-anchor="middle" class="text-body" fill="#6ee7b7">3. Actual State</text>
      <text x="640" y="175" text-anchor="middle" class="text-code">status: replicas: 2</text>
      <text x="640" y="200" text-anchor="middle" class="text-sub">(Running in Cluster)</text>

      <!-- Loop Arrows -->
      <path d="M 260 170 Q 400 130 540 170" class="arrow-hl"/>
      <path d="M 640 230 Q 560 300 500 300" class="arrow"/>
      <path d="M 300 300 Q 180 300 160 230" class="arrow-hl"/>
      <text x="400" y="120" text-anchor="middle" class="text-sub" fill="#38bdf8">Compares Difference</text>
    </svg>