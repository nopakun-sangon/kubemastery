<svg viewBox="0 0 860 420" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
      
  <style>
    .bg { fill: #0f172a; rx: 16; }
    .card { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 12; }
    .card-hl { fill: #1e3a8a; stroke: #3b82f6; stroke-width: 2; rx: 12; }
    .card-cp { fill: #312e81; stroke: #6366f1; stroke-width: 2; rx: 12; }
    .card-worker { fill: #064e3b; stroke: #10b981; stroke-width: 2; rx: 12; }
    .text-title { fill: #f8fafc; font-family: system-ui, sans-serif; font-size: 18px; font-weight: bold; }
    .text-sub { fill: #94a3b8; font-family: system-ui, sans-serif; font-size: 13px; }
    .text-body { fill: #e2e8f0; font-family: system-ui, sans-serif; font-size: 14px; font-weight: 600; }
    .text-code { fill: #38bdf8; font-family: monospace; font-size: 13px; }
    .text-badge { fill: #38bdf8; font-family: system-ui, sans-serif; font-size: 11px; font-weight: bold; }
    .arrow { stroke: #64748b; stroke-width: 2; marker-end: url(#arrowhead); fill: none; }
    .arrow-hl { stroke: #38bdf8; stroke-width: 2.5; marker-end: url(#arrowhead-hl); fill: none; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#64748b"/>
    </marker>
    <marker id="arrowhead-hl" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#38bdf8"/>
    </marker>
  </defs>

      <rect width="860" height="420" class="bg"/>
      <text x="430" y="40" text-anchor="middle" class="text-title">Kubernetes Service &amp; Packet Routing Architecture</text>
      <text x="430" y="65" text-anchor="middle" class="text-sub">How ClusterIP and kube-proxy distribute traffic across Endpoints</text>

      <!-- Client Request -->
      <rect x="40" y="150" width="150" height="90" class="card-hl"/>
      <text x="115" y="185" text-anchor="middle" class="text-body">Client / Pod</text>
      <text x="115" y="210" text-anchor="middle" class="text-code">curl my-svc:80</text>

      <!-- Virtual ClusterIP -->
      <rect x="250" y="130" width="220" height="130" class="card-cp"/>
      <text x="360" y="165" text-anchor="middle" class="text-body" fill="#a5b4fc">Service (ClusterIP)</text>
      <text x="360" y="190" text-anchor="middle" class="text-code">10.96.120.40:80</text>
      <text x="360" y="215" text-anchor="middle" class="text-sub">kube-proxy iptables/IPVS</text>
      <text x="360" y="235" text-anchor="middle" class="text-sub">DNAT to Pod IP</text>

      <!-- EndpointSlices / Pods -->
      <rect x="540" y="100" width="270" height="230" class="card-worker"/>
      <text x="675" y="130" text-anchor="middle" class="text-body" fill="#6ee7b7">EndpointSlice Targets</text>

      <rect x="560" y="150" width="230" height="45" class="card" fill="#065f46"/>
      <text x="675" y="177" text-anchor="middle" class="text-code">Pod A: 10.244.1.20:8080</text>

      <rect x="560" y="205" width="230" height="45" class="card" fill="#065f46"/>
      <text x="675" y="232" text-anchor="middle" class="text-code">Pod B: 10.244.2.35:8080</text>

      <rect x="560" y="260" width="230" height="45" class="card" fill="#065f46"/>
      <text x="675" y="287" text-anchor="middle" class="text-code">Pod C: 10.244.3.12:8080</text>

      <path d="M 190 195 L 250 195" class="arrow-hl"/>
      <path d="M 470 195 L 540 195" class="arrow-hl"/>
    </svg>