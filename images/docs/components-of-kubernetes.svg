<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
      
  <style>
    .bg { fill: #0f172a; rx: 16; }
    .card { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 12; }
    .card-hl { fill: #1e3a8a; stroke: #3b82f6; stroke-width: 2; rx: 12; }
    .card-cp { fill: #312e81; stroke: #6366f1; stroke-width: 2; rx: 12; }
    .card-worker { fill: #064e3b; stroke: #10b981; stroke-width: 2; rx: 12; }
    .text-title { fill: #f8fafc; font-family: system-ui, sans-serif; font-size: 18px; font-weight: bold; }
    .text-sub { fill: #94a3b8; font-family: system-ui, sans-serif; font-size: 13px; }
    .text-body { fill: #e2e8f0; font-family: system-ui, sans-serif; font-size: 14px; font-weight: 600; }
    .text-code { fill: #38bdf8; font-family: monospace; font-size: 13px; }
    .text-badge { fill: #38bdf8; font-family: system-ui, sans-serif; font-size: 11px; font-weight: bold; }
    .arrow { stroke: #64748b; stroke-width: 2; marker-end: url(#arrowhead); fill: none; }
    .arrow-hl { stroke: #38bdf8; stroke-width: 2.5; marker-end: url(#arrowhead-hl); fill: none; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#64748b"/>
    </marker>
    <marker id="arrowhead-hl" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#38bdf8"/>
    </marker>
  </defs>

      <rect width="900" height="520" class="bg"/>
      <text x="450" y="40" text-anchor="middle" class="text-title">Kubernetes Architecture &amp; Core Components</text>
      <text x="450" y="65" text-anchor="middle" class="text-sub">Control Plane (Master) and Worker Node Subsystems</text>

      <!-- Control Plane Box -->
      <rect x="40" y="90" width="400" height="390" class="card-cp" rx="16"/>
      <text x="60" y="125" class="text-title" fill="#a5b4fc">☸️ Control Plane Components</text>

      <rect x="60" y="145" width="360" height="60" class="card-hl"/>
      <text x="80" y="170" class="text-body">kube-apiserver</text>
      <text x="80" y="190" class="text-sub">API Gateway, Auth, Validation, etcd access</text>

      <rect x="60" y="220" width="170" height="70" class="card"/>
      <text x="75" y="245" class="text-body">kube-scheduler</text>
      <text x="75" y="270" class="text-sub">Pod placement &amp; filtering</text>

      <rect x="250" y="220" width="170" height="70" class="card"/>
      <text x="265" y="245" class="text-body">controller-mgr</text>
      <text x="265" y="270" class="text-sub">Node, Replica, Endpoints</text>

      <rect x="60" y="310" width="360" height="75" class="card" fill="#1e1b4b" stroke="#818cf8"/>
      <text x="80" y="340" class="text-body" fill="#c7d2fe">etcd (Distributed Key-Value Store)</text>
      <text x="80" y="365" class="text-sub">Cluster state, metadata, config storage</text>

      <rect x="60" y="405" width="360" height="55" class="card"/>
      <text x="80" y="435" class="text-sub">cloud-controller-manager (Optional: cloud routing &amp; LB)</text>

      <!-- Worker Nodes Box -->
      <rect x="470" y="90" width="390" height="390" class="card-worker" rx="16"/>
      <text x="490" y="125" class="text-title" fill="#6ee7b7">🖥️ Worker Node (kubelet &amp; workloads)</text>

      <rect x="490" y="145" width="350" height="65" class="card"/>
      <text x="510" y="172" class="text-body" fill="#34d399">kubelet (Node Agent)</text>
      <text x="510" y="195" class="text-sub">Interacts with CRI, mounts volumes, health checks</text>

      <rect x="490" y="225" width="350" height="65" class="card"/>
      <text x="510" y="252" class="text-body" fill="#38bdf8">kube-proxy</text>
      <text x="510" y="275" class="text-sub">iptables / IPVS Service packet routing</text>

      <!-- Pods box inside worker -->
      <rect x="490" y="305" width="350" height="155" class="card" fill="#0f291e" stroke="#059669"/>
      <text x="510" y="332" class="text-body" fill="#a7f3d0">Container Runtime Interface (CRI / containerd)</text>
      <rect x="510" y="350" width="145" height="90" class="card" fill="#134e4a"/>
      <text x="525" y="375" class="text-body">Pod A</text>
      <text x="525" y="400" class="text-sub">[App Container]</text>
      <text x="525" y="420" class="text-code">10.244.1.15</text>

      <rect x="675" y="350" width="145" height="90" class="card" fill="#134e4a"/>
      <text x="690" y="375" class="text-body">Pod B</text>
      <text x="690" y="400" class="text-sub">[App + Sidecar]</text>
      <text x="690" y="420" class="text-code">10.244.1.16</text>

      <!-- Connecting arrows -->
      <path d="M 420 175 L 490 175" class="arrow-hl"/>
      <path d="M 420 250 L 490 250" class="arrow"/>
    </svg>