<svg viewBox="0 0 800 380" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
      
  <style>
    .bg { fill: #0f172a; rx: 16; }
    .card { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 12; }
    .card-hl { fill: #1e3a8a; stroke: #3b82f6; stroke-width: 2; rx: 12; }
    .card-cp { fill: #312e81; stroke: #6366f1; stroke-width: 2; rx: 12; }
    .card-worker { fill: #064e3b; stroke: #10b981; stroke-width: 2; rx: 12; }
    .text-title { fill: #f8fafc; font-family: system-ui, sans-serif; font-size: 18px; font-weight: bold; }
    .text-sub { fill: #94a3b8; font-family: system-ui, sans-serif; font-size: 13px; }
    .text-body { fill: #e2e8f0; font-family: system-ui, sans-serif; font-size: 14px; font-weight: 600; }
    .text-code { fill: #38bdf8; font-family: monospace; font-size: 13px; }
    .text-badge { fill: #38bdf8; font-family: system-ui, sans-serif; font-size: 11px; font-weight: bold; }
    .arrow { stroke: #64748b; stroke-width: 2; marker-end: url(#arrowhead); fill: none; }
    .arrow-hl { stroke: #38bdf8; stroke-width: 2.5; marker-end: url(#arrowhead-hl); fill: none; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#64748b"/>
    </marker>
    <marker id="arrowhead-hl" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#38bdf8"/>
    </marker>
  </defs>

      <rect width="800" height="380" class="bg"/>
      <text x="400" y="40" text-anchor="middle" class="text-title">HorizontalPodAutoscaler (HPA) Metrics Loop</text>
      <text x="400" y="65" text-anchor="middle" class="text-sub">Dynamic Scaling based on CPU/Memory or Custom Metrics</text>

      <rect x="80" y="120" width="180" height="100" class="card-hl"/>
      <text x="170" y="155" text-anchor="middle" class="text-body">HPA Controller</text>
      <text x="170" y="180" text-anchor="middle" class="text-sub">Checks every 15s</text>
      <text x="170" y="200" text-anchor="middle" class="text-code">target: 70% CPU</text>

      <rect x="330" y="120" width="180" height="100" class="card-cp"/>
      <text x="420" y="155" text-anchor="middle" class="text-body" fill="#a5b4fc">Metrics Server</text>
      <text x="420" y="180" text-anchor="middle" class="text-sub">Aggregates usage</text>
      <text x="420" y="200" text-anchor="middle" class="text-code">Current: 85% CPU</text>

      <rect x="580" y="120" width="160" height="100" class="card-worker"/>
      <text x="660" y="155" text-anchor="middle" class="text-body" fill="#6ee7b7">Deployment</text>
      <text x="660" y="180" text-anchor="middle" class="text-sub">Scale Replicas</text>
      <text x="660" y="205" text-anchor="middle" class="text-code">3 -> 5 Pods</text>

      <path d="M 260 170 L 330 170" class="arrow"/>
      <path d="M 510 170 L 580 170" class="arrow-hl"/>
      <path d="M 660 220 Q 400 310 170 220" class="arrow-hl"/>
      <text x="415" y="295" text-anchor="middle" class="text-sub" fill="#38bdf8">Replicas = ceil[currentReplicas * (currentMetric / targetMetric)]</text>
    </svg>